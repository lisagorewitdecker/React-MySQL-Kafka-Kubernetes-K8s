apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: bashj79/kafka-kraft:latest
          ports:
            - containerPort: 9092
          command:
            - /bin/bash
            - -c
          args:
            - |
              sed -i 's|^advertised.listeners=.*|advertised.listeners=PLAINTEXT://kafka-service:9092|' /opt/kafka/config/kraft/server.properties
              if [ -f /tmp/kraft-combined-logs/meta.properties ]; then
                exec /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties
              fi
              exec /bin/start_kafka.sh
          volumeMounts:
            - name: kafka-data
              mountPath: /tmp/kraft-combined-logs
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
spec:
  selector:
    app: kafka
  ports:
    - protocol: TCP
      port: 9092
      targetPort: 9092